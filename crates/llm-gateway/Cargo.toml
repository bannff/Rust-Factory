[package]
name = "llm-gateway"
description = "Implemented bounded provider-neutral LLM generation gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[package.metadata.rust-factory]
family = "llm-gateway"
role = "brick"
status = "implemented"

[features]
static = []
genai = ["dep:genai", "dep:tokio"]
tokio_cancellation = ["dep:tokio-util"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
genai = { workspace = true, optional = true, default-features = false }
tokio = { workspace = true, optional = true, features = ["macros"] }
tokio-util = { version = "=0.7.19", optional = true }

[lints]
workspace = true
