[package]
name = "observability"
description = "Bounded tenant-scoped operational log telemetry."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[package.metadata.rust-factory]
family = "observability"
role = "brick"
status = "implemented"

[features]
local = []
settings = ["dep:schemars", "dep:serde"]
opentelemetry = ["dep:opentelemetry"]
mcp = ["dep:anyhow", "dep:policy", "dep:rmcp", "dep:schemars", "dep:serde", "dep:serde_json"]

[dependencies]
anyhow = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
policy = { path = "../policy", version = "=0.1.0", optional = true }
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
toml = "=0.8.23"

[lints]
workspace = true
