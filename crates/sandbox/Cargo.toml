[package]
name = "sandbox"
description = "Minimal provider-neutral sandbox contracts with Docker CLI and MCP adapters."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[package.metadata.rust-factory]
family = "sandbox"
role = "brick"
status = "migration-pending"

[features]
default = []
docker = ["dep:sha2", "dep:subprocess"]
mcp = ["dep:anyhow", "dep:policy", "dep:rmcp", "dep:schemars", "dep:serde", "dep:serde_json"]

[dependencies]
anyhow = { workspace = true, optional = true }
policy = { path = "../policy", version = "=0.1.0", optional = true }
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subprocess = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
