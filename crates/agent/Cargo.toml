[package]
name = "agent"
description = "Transport-independent agent definitions and bounded local runtime contracts."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[package.metadata.rust-factory]
family = "agent"
role = "brick"
status = "implemented"

# The default build is the framework-free capability. Every adapter is opt-in and
# no feature is enabled by default, so a consumer that wants only the typed Rust
# contracts compiles no transport, schema, or runtime dependency.
[features]
mcp = ["dep:anyhow", "dep:policy", "dep:rmcp", "dep:schemars", "dep:serde"]

[dependencies]
knowledge = { path = "../knowledge", version = "=0.1.0" }
llm-gateway = { path = "../llm-gateway", version = "=0.1.0" }
serde_json.workspace = true
sha2.workspace = true

anyhow = { workspace = true, optional = true }
policy = { path = "../policy", version = "=0.1.0", optional = true }
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
knowledge = { path = "../knowledge", version = "=0.1.0", features = ["static"] }
llm-gateway = { path = "../llm-gateway", version = "=0.1.0", features = ["static"] }
proptest.workspace = true

[lints]
workspace = true
