[package]
name = "mcp-transport"
description = "Bounded server-side MCP stdio transport adapter."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[package.metadata.rust-factory]
family = "mcp-transport"
role = "infrastructure"
status = "implemented"

[dependencies]
futures = "=0.3.34"
mcp-contract = { path = "../mcp-contract", version = "=0.1.0" }
rmcp.workspace = true
serde = "=1.0.228"
serde_json = "=1.0.145"
tokio = { version = "=1.49.0", features = ["io-util", "sync"] }
tokio-util = { version = "=0.7.19", features = ["codec"] }

[dev-dependencies]
project = { path = "../project", version = "=0.1.0", features = ["mcp"] }
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread", "time", "io-util"] }

[lints]
workspace = true
