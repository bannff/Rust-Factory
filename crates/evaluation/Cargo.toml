[package]
name = "evaluation"
description = "Deterministic, immutable evaluation contracts for terminal workflow evidence."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[package.metadata.rust-factory]
family = "evaluation"
role = "brick"
status = "implemented"

# No feature is enabled by default: the default build is the framework-free
# capability, and every adapter is opt-in.
[features]
local = []
mcp = ["dep:anyhow", "dep:policy", "dep:rmcp", "dep:schemars", "dep:serde", "dep:serde_json"]
memory = []
serdes-ai-evals = ["dep:serdes-ai-evals"]
settings = ["dep:schemars", "dep:serde"]

[dependencies]
sha2.workspace = true

anyhow = { workspace = true, optional = true }
policy = { path = "../policy", version = "=0.1.0", optional = true }
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serdes-ai-evals = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
