[package]
name = "memory"
description = "Tenant-scoped agent memory with a framework-agnostic port and selectable adapters."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
[package.metadata.rust-factory]
family = "memory"
role = "brick"
status = "implemented"
# No feature is enabled by default: the default build is the framework-free
# capability, and every framework adapter is opt-in.
[features]
agentic = ["dep:agentic-memory"]
# Zero-dependency, but still opt-in: an adapter is never in the default build,
# and gating it keeps the "a core module names no adapter" path rule applying to
# this module like any other.
local = []
mcp = ["dep:anyhow", "dep:policy", "dep:rmcp", "dep:schemars", "dep:serde", "dep:serde_json"]
settings = ["dep:schemars", "dep:serde"]
[dependencies]
agentic-memory = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
policy = { path = "../policy", version = "=0.1.0", optional = true }
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
[dev-dependencies]
serde_json.workspace = true
[lints]
workspace = true
