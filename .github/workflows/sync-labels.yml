name: Sync labels

on:
  workflow_dispatch:
  push:
    paths:
      - .github/labels.yml
      - scripts/sync_labels.py

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/sync_labels.py
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
