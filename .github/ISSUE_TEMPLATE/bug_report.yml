name: Bug report
description: Report behavior that differs from the intended Rust Factory contract.
title: "[bug]: "
labels:
  - status/triage
  - type/bug
  - priority/medium
body:
  - type: markdown
    attributes:
      value: "Thank you for reporting a reproducible defect. Do not include secrets or private paths."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, what did you expect, and why is this a defect?
      placeholder: Expected behavior, actual behavior, and the observed impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest deterministic steps, input, command, and observed output.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State the observable behavior that will demonstrate the fix.
    validations:
      required: true
  - type: dropdown
    id: rust_toolchain_scope
    attributes:
      label: Rust toolchain scope
      options:
        - No toolchain change
        - Rust version or edition
        - Cargo workspace or dependency
        - Formatting, linting, or test tooling
    validations:
      required: true
  - type: textarea
    id: crate_scope
    attributes:
      label: Crate scope
      description: List affected crate(s), module(s), or write "unknown".
    validations:
      required: true
  - type: checkboxes
    id: api_adapter_scope
    attributes:
      label: API and adapter scope
      options:
        - label: Public Rust API or trait contract is affected.
        - label: Core domain behavior is affected.
        - label: An MCP, filesystem, storage, provider, or network adapter is affected.
