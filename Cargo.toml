[workspace]
members = [
    "crates/factory-core",
    "crates/policy-core",
    "crates/policy-memory",
    "crates/agent-core",
    "crates/agent-mcp",
    "crates/project-core",
    "crates/project-fs",
    "crates/project-mcp",
    "crates/workflow-core",
    "crates/workflow-memory",
    "crates/workflow-mcp",
    "crates/evaluation-core",
    "crates/evaluation-memory",
    "crates/evaluation-mcp",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
authors = ["Rust Factory contributors"]
repository = "https://example.invalid/rust-factory"

[workspace.dependencies]
anyhow = "=1.0.100"
cap-std = "=4.0.3"
rmcp = { version = "=3.1.4", features = ["macros", "server", "transport-io"] }
schemars = "=1.2.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
