[workspace]
members = [
    "crates/auth",
    "crates/storage",
    "crates/policy",
    "crates/mcp-transport",
    "crates/agent",
    "crates/project",
    "crates/workflow",
    "crates/evaluation",
    "crates/llm-gateway",
    "crates/memory",
    "crates/knowledge",
    "crates/sandbox",
    "crates/observability",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
authors = ["Rust Factory contributors"]
repository = "https://example.invalid/rust-factory"

[workspace.dependencies]
agentic-memory = { version = "=0.4.2", default-features = false }
anyhow = "=1.0.100"
biscuit-auth = { version = "=6.0.0", default-features = false }
cap-std = "=4.0.3"
genai = { version = "=0.6.0", default-features = false }
opentelemetry = { version = "=0.32.0", default-features = false, features = ["logs"] }
rmcp = { version = "=3.1.4", features = ["macros", "server", "transport-io"] }
proptest = "=1.6.0"
redb = { version = "=2.6.3", default-features = false }
schemars = "=1.2.2"
serdes-ai-evals = { version = "=0.2.6", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
